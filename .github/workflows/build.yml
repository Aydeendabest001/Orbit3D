name: Build Orbit 3D (Windows VST3)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Picks up whichever Visual Studio / MSVC the runner image ships (2022, 2026, ...)
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        run: python -m pip install ninja

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Collect VST3
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $v = Get-ChildItem -Path build -Recurse -Directory -Filter "*.vst3" | Select-Object -First 1
          if (-not $v) { throw "No .vst3 was produced" }
          Copy-Item -Recurse $v.FullName (Join-Path dist $v.Name)
          Get-ChildItem dist -Recurse | Select-Object -First 20 FullName

      - uses: actions/upload-artifact@v4
        with:
          name: Orbit-3D-VST3
          path: dist/
